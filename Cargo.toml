[package]
name = "kaadivisors"
version = "2.0.0"
authors = ["Khafizov Alexey"]
edition = "2024"
description = "Very fast algorithm for finding prime divisors of huge composite numbers. By KAA"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
overflow-checks = false
panic = 'unwind'
incremental = false

[dependencies]
num-traits = { version = "0.2", default-features = false }
